extra:
  generator: false # do not display "Made with Material for MkDocs"
  analytics:
    provider: google
    property: G-G0LK68FDTM
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://github.com/jhpce-jhu/jhpce_mkdocs/discussions/categories/website-feedback" target="_blank" rel="noopener">website feedback forum</a>.
# hide footer in specific pages with these instructions:
# https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/#hiding-prevnext-links
#
# EXCLUDE FILES OR DIRECTORIES
# This follows the .gitignore pattern format
# (https://www.mkdocs.org/user-guide/configuration/#exclude_docs)
# (https://git-scm.com/docs/gitignore#_pattern_format)
#
exclude_docs: |
  bak/
# We added bak/ to an actual .gitignore file but if we instead used the
# exclude_docs: directive, the github repo would contain those files. Which JRT
# thinks are _much_ easier to peruse looking for deltas or other info without
# having to hunt through Github changelogs. 20261019 JRT HAS NOT YET MODIFIED
# THE .GITIGNORE FILE.
#
# ALLOW DRAFT VERSIONS TO BE KEPT  
# JRT added 20261019
# This directive and list of files/dirs cause them not to render in the actual
# web site.  However, if you use "mkdocs --serve" & "mkdocs --build" locally,
# they WILL be rendered. They will contain a small "DRAFT" label rendered
# above the content.
# This follows the .gitignore pattern format, so adding a trailing slash to
# directory names means that pattern can be located anywhere inside docs/
draft_docs: |
  drafts/
#
# VALIDATION CONTROLS
# These validation controls cause "mkdocs --serve" & "mkdocs --build"
# to issue useful warnings. So one can see them when working locally, before
# pushing files into the repo.
#    https://www.mkdocs.org/user-guide/configuration/#validation
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
